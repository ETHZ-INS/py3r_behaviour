[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r-behaviour"
version = "2.5.0"
description = "Behaviour analysis tools for the py3r namespace package"
authors = [{ name = "Tom Lorimer" }]
dependencies = [
    "numpy>=2.3,<3.0.0",
    "pandas>=2.3,<3.0.0",
    "matplotlib>=3.10,<4.0.0",
    "seaborn>=0.13,<1.0.0",
    "scikit-learn>=1.7,<2.0.0",
    "scipy>=1.16,<2.0.0",
    "scikit-image>=0.25,<1.0.0",
    "shapely>=2.1,<3.0.0",
    "opencv-python>=4.11,<5.0.0",
    "pyarrow>=20.0,<21.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.14.14",
  "pre-commit==3.8.0",  # optional but strongly recommended
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["py3r.*"] 

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src", "tests"]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E/F  = pycodestyle + pyflakes
# I    = import sorting (replaces isort)
# B    = bugbear (common footguns)
# UP   = pyupgrade (modern syntax)

# Generated batch mixins:
# - E501: docstrings mirror leaf methods and can exceed line-length
# - B009: generator emits getattr(_obj, "method_name")(...) by design
# - I001: import order is fixed by the generator
[tool.ruff.lint.extend-per-file-ignores]
"src/py3r/behaviour/tracking/tracking_collection_batch_mixin.py" = ["E501", "B009", "I001"]
"src/py3r/behaviour/features/features_collection_batch_mixin.py" = ["E501", "B009", "I001"]
"src/py3r/behaviour/summary/summary_collection_batch_mixin.py" = ["E501", "B009", "I001"]

[tool.ruff.format]
# defaults intentionally left alone
