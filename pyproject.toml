[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r-behaviour"
version = "3.4.0"
description = "Behaviour analysis tools for the py3r namespace package"
authors = [{ name = "Tom Lorimer" }]
dependencies = [
    "numpy>=2.3,<3.0.0",
    "pandas>=2.3,<3.0.0",
    "matplotlib>=3.10,<4.0.0",
    "seaborn>=0.13,<1.0.0",
    "scikit-learn>=1.7,<2.0.0",
    "scipy>=1.16,<2.0.0",
    "scikit-image>=0.25,<1.0.0",
    "shapely>=2.1,<3.0.0",
    "opencv-python>=4.11,<5.0.0",
    "pyarrow>=20.0,<21.0.0; python_version < '3.14'",
    "pyarrow>=24.0.0; python_version >= '3.14'",
    "statannotations>=0.7,<1.0.0",
    "tqdm>=4.60,<5.0.0",
]

[project.optional-dependencies]
# Optional heavy visualization dependencies
viz = [
    "pycirclize>=1,<2.0.0",
    "umap-learn>=0.5,<1.0.0",
]
# ONNX inference (for OnnxClassifier)
onnx = [
    "onnxruntime>=1.18,<2.0.0",
]
# Developer tooling: testing, notebooks-as-tests, and documentation build
dev = [
    # testing
    "pytest>=8,<9.0.0",
    "xdoctest>=1,<2.0.0",
    "nbmake>=1,<2.0.0",
    # docs
    "mkdocs-material>=9,<10.0.0",
    "mkdocs-autorefs>=1,<2.0.0",
    "mkdocstrings[python]>=0.25,<1.0.0",
    "mkdocs-glightbox>=0.4,<1.0.0",
    "mike>=2,<3.0.0",
    # notebooks workflow and diffs
    "nbdime>=3,<4.0.0",
    "nbstripout>=0.7,<1.0.0",
    "jupytext>=1,<2.0.0",
    # notebook rendering (tools/render_notebooks.py)
    "nbformat>=5,<6.0.0",
    "nbclient>=0.10,<1.0.0",
    "ruff==0.14.14",
    "pre-commit==3.8.0",  # optional but strongly recommended
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["py3r.*"] 

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src", "tests"]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D205", "D212", "D400", "D401", "D416"]
# E/F  = pycodestyle + pyflakes
# I    = import sorting (replaces isort)
# B    = bugbear (common footguns)
# UP   = pyupgrade (modern syntax)
# D105 = magic method docstrings — not required
# D107 = __init__ docstrings not required (class docstring covers it)
# D205 = blank-line-after-summary not enforced; zero effect on rendering
# D212 = we use second-line summary style (D213), not first-line
# D416 = Examples sections tolerate numpy underline format

# pipeline notebook .py files: E402 because imports not at top of file by design
[tool.ruff.lint.extend-per-file-ignores]
"tests/**/oft_pipeline.py" = ["E402"]

[tool.ruff.format]
# defaults intentionally left alone

[tool.ruff.lint.pydocstyle]
convention = "google"
