[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py3r-behaviour"
version = "2.5.0"
description = "Behaviour analysis tools for the py3r namespace package"
authors = [{ name = "Tom Lorimer" }]
dependencies = [
    "numpy>=2.3,<3.0.0",
    "pandas>=2.3,<3.0.0",
    "matplotlib>=3.10,<4.0.0",
    "seaborn>=0.13,<1.0.0",
    "scikit-learn>=1.7,<2.0.0",
    "scipy>=1.16,<2.0.0",
    "scikit-image>=0.25,<1.0.0",
    "shapely>=2.1,<3.0.0",
    "opencv-python>=4.11,<5.0.0",
    "pyarrow>=20.0,<21.0.0",
]

[project.optional-dependencies]
# Developer tooling: testing, notebooks-as-tests, and documentation build
dev = [
    # testing
    "pytest>=8,<9.0.0",
    "xdoctest>=1,<2.0.0",
    "nbmake>=1,<2.0.0",
    # docs
    "mkdocs-material>=9,<10.0.0",
    "mkdocs-autorefs>=1,<2.0.0",
    "mkdocstrings[python]>=0.25,<1.0.0",
    "mike>=2,<3.0.0",
    # notebooks workflow and diffs
    "nbdime>=3,<4.0.0",
    "nbstripout>=0.7,<1.0.0",
    "jupytext>=1,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["py3r.*"] 

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src", "tests"]
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]
filterwarnings = ["ignore::UserWarning"]