# .pre-commit-config.yaml
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-format
      - id: ruff-check

  - repo: local
    hooks:
      - id: generate-batch-mixins
        name: generate batch mixins
        entry: python tools/gen_batch_mixins.py
        language: system
        pass_filenames: false
        stages: [manual]
